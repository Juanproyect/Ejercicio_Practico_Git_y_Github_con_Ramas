<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Registro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" id="container">
    <!-- Formulario de Sign In -->
    <div class="form-container sign-in-container">
      <form action="#">
        <h1>Sign In</h1>
        <input type="email" placeholder="Email" />
        <input type="password" placeholder="Password" />
        <a href="#">¿Olvidaste tu contraseña?</a>
        <button>Sign In</button>
      </form>
    </div>

    <!-- Formulario de Sign Up -->
    <div class="form-container sign-up-container">
      <form action="#">
        <h1>Create Account</h1>
        <input type="text" placeholder="Nombre" />
        <input type="email" placeholder="Email" />
        <input type="password" placeholder="Password" />
        <button>Sign Up</button>
      </form>
    </div>

    <!-- Panel lateral -->
    <div class="overlay-container">
      <div class="overlay">
        <div class="overlay-panel overlay-left">
          <h1>Bienvenido de nuevo!</h1>
          <p>Para mantenerte conectado, inicia sesión con tus datos</p>
          <button class="ghost" id="login">Sign In</button>
        </div>
        <div class="overlay-panel overlay-right">
          <h1>Hola, Amigo!</h1>
          <p>Regístrate y comienza tu viaje con nosotros</p>
          <button class="ghost" id="register">Sign Up</button>
        </div>
      </div>
    </div>
  </div>

  <script src="layout.js"></script>
</body>
</html>
